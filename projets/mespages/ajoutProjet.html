{% extends 'master.html' %}

{% block contentPage %}
<!-- <div class="container "> -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card " style="padding: 1px;">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Ajouter un Nouveau Projet</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-2 d-flex">
                            <label for="codeProjet" class="form-label"><i class="fa fa-key" aria-hidden="true"></i> Code</label>
                            {{ form.codeProjet }}
                        </div>

                        <div class="mb-2 d-flex">
                            <label for="nomProjet" class="form-label"><i class="fas fa-folder"></i> Nom</label>
                            {{ form.nomProjet }}
                        </div>

                        <div class="mb-2 d-flex">
                            <label for="description" class="form-label"><i class="fas fa-align-left"></i> Description</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-2">
                            <label for="dateDebut" class="form-label"><i class="fas fa-calendar-alt"></i> Date de Début</label>
                            {{ form.dateDebut }}
                        </div>

                        <div class="mb-2">
                            <label for="dateEcheanche" class="form-label"><i class="fas fa-calendar-check"></i> Date d'Échéance</label>
                            {{ form.dateEcheanche }}
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Ajouter</button>
                            <a href="{% url 'projets' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
<!-- </div> -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

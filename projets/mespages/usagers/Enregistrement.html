{% extends 'master.html' %}

{% block contentPage %}
<div class="container mt-5">
    <div class="card border-0">
        <div class="card-header bg-info text-white text-center">
            <h2>Enregistrer un Employé</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="fw-bold">Nom d'utilisateur</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="fw-bold">Courriel</label>
                    {{ form.email }}
                </div>
                <div class="mb-3">
                    <label class="fw-bold">Mot de passe </label>
                    {{ form.password1 }}
                </div>
                <div class="mb-3">
                    <label class="fw-bold">Confirmation de mot de passe</label>
                    {{ form.password2 }}
                </div>
                <button type="submit" class="btn btn-success mt-3">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
